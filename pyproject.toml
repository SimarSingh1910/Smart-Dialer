[project]
name = "smartdialer"
version = "0.1.0"
description = "Progressive and predictive outbound dialer for debt collections"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary,pool]>=3.1",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["smartdialer*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
